name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK with Buildozer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixin-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libsqlite3-dev \
            sqlite3 \
            libffi-dev \
            libssl-dev \
            lzma \
            liblzma-dev \
            ccache \
            openjdk-17-jdk \
            zip \
            unzip

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip setuptools
          pip install "cython<3.0.0"
          pip install buildozer

      - name: Check buildozer.spec
        run: |
          if [ ! -f "buildozer.spec" ]; then
            echo "File buildozer.spec tidak ditemukan di repo! Membuat default..."
            buildozer init
          fi

      - name: Build APK with Buildozer
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSES: '1'
        run: |
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PabloEnterprise-Android-APK
          path: bin/*.apk
